# Maven
# Build your Java project and run tests with Apache Maven using your self-hosted agent.

trigger:
- master

pool:
  name: 'SelfHostedPool'

steps:
- task: Maven@3
  displayName: 'Execute Web Automation Test Suite'
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    
    # CHANGE THESE LINES TO FORCE A COMPATIBLE JAVA VERSION:
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.17' # Instructs the agent runner to fall back to a stable Java 17 environment
    
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'clean test'