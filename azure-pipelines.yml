trigger:
- none

pool:
  name: 'SelfHostedPool'

steps:
- task: Maven@3
  displayName: 'Execute Web Automation Test Suite'
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    
    # Corrected Java Home configuration for Self-Hosted Agents
    javaHomeOption: 'Path'
    jdkUserInputPath: '$(JAVA_HOME)' # Points directly to your machine's SDK root folder
    
    # CRUCIAL FIX: Tells the pipeline to continue and publish reports even if a test fails
    testFailureIgnore: true
    
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'clean test -X'